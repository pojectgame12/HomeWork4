<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Shadow Switch — תצוגת סיפור אינטראקטיבית</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1422;color:#e8f1fa;font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.65}
.container{max-width:830px;margin:40px auto;padding:0 18px 60px}.eyebrow{letter-spacing:.02em;color:#91d8cd;font-size:14px;margin-bottom:9px}.banner{border:1px solid #385166;border-radius:12px;padding:11px 16px;background:#13283a;color:#c9ddeb;font-size:13px;margin-bottom:22px}
.card{border:1px solid #33475d;background:#142439;border-radius:18px;padding:24px 28px;box-shadow:0 8px 30px #0004}h1{font-size:28px;margin:0 0 12px}p{margin:0 0 22px;white-space:pre-wrap}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 23px}.stat{background:#213a50;color:#d8e9f5;border-radius:40px;padding:5px 12px;font-size:13px}
.choices{display:grid;gap:10px}button.choice{cursor:pointer;border:1px solid #527f91;background:#173b4c;color:#dcf7f5;text-align:right;font-size:16px;border-radius:9px;padding:12px 16px;line-height:1.5}button.choice:hover{background:#276577}button:focus-visible{outline:3px solid #eed08a}
.footer{color:#8ba2b9;font-size:13px;margin-top:20px}a{color:#94ddd9} .row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.again{background:transparent;color:#aee7e3;border:0;text-decoration:underline;cursor:pointer;font-size:14px}
@media(max-width:540px){.card{padding:22px 18px}h1{font-size:23px}.container{margin-top:17px}}
</style>
</head><body><div class="container"><div class="eyebrow">SHADOW SWITCH · THE LAST BEACON</div>
<div class="banner"><strong>תצוגה עצמאית לבדיקה:</strong> סיפור זה נוצר לפי מקור Twee המצורף, אך הקובץ הזה אינו ייצוא רשמי של מנוע Twine. להגשה יש לייצא HTML מתוך Twine.</div>
<div class="card"><div class="row"><span id="sceneCount" class="eyebrow">סצנה 1</span><button class="again" id="restart" type="button">להתחיל מחדש</button></div>
<h1 id="title"></h1><p id="content"></p><div class="stats" id="stats"></div><div class="choices" id="choices"></div></div>
<div class="footer">הגרסה הזו משמשת להדגמת הסתעפויות ולקביעת תנאי סיום; השפעתן על Unity דורשת מימוש נפרד.</div></div>
<script>
const passages={"Start":{"title":"המגדלור האחרון","text":"עמק שלם שקע בחשכה. נור, שומר/ת האור האחרון/ה, מגיע/ה למצפה הנעול. השומר האפור מזהיר כי הפעלת הליבה אסורה. מאיה מבקשת להשיב את האור — אך לא בכל מחיר.","effects":{"reset":1},"choices":[["להתקרב לפנס וללמוד כיצד הוא פועל","InspectLamp"],["להדליק את הפנס מיד","LightLamp"]]},"InspectLamp":{"title":"האור והאובליסק","text":"לוחית הדרכה ישנה מגלה: רק אלומה בזווית הנכונה מייצבת את הצל המוטל מן האובליסק לגשר מוצק. כשהאור כבה, גם הגשר נעלם.","choices":[["לכוון את האלומה","LightLamp"]]},"LightLamp":{"title":"הגשר הראשון","text":"האלומה פוגעת באובליסק. גשר סגול מתייצב מעל הבור. מאיה קוראת: ״חצה/י עכשיו, כל רגע פנס דולק מכלה אנרגיה!״","effects":{"energy":-1},"choices":[["לחצות את הגשר","CrossBridge"]]},"CrossBridge":{"title":"המסוף השבור","text":"המסלול הראשון מאחוריך. בקצה החדר מסוף שבור וצלצול אזהרה: נותר מעט זמן לפני שהמצפה יינעל סופית.","choices":[["להמשיך לצומת המסופים","Fork"]]},"Fork":{"title":"צומת המסופים","text":"מצד אחד יומן בטיחות; מצד שני תחנת הקשר של מאיה. שתיהן דורשות אנרגיה. מעבר ישיר לליבה יחסוך משאבים, אך ישאיר שאלות פתוחות.","choices":[["לפתוח את יומן הבטיחות (−1 אנרגיה)","ReadArchive","!clue"],["לשחזר את הקשר עם מאיה (−1 אנרגיה)","HelpMaya","!helped"],["להתקדם לליבה","GuardianGate"]]},"ReadArchive":{"title":"ראיה מן העבר","text":"לפי רישום המהנדסים, הפעלה מיידית מחזירה אור במהירות אבל מסכנת את רשת התשתיות. כיול מיוחד יכול לייצב את הליבה.","effects":{"energy":-1,"clue":true},"choices":[["לחזור למסדרון","Fork"]]},"HelpMaya":{"title":"קולה של מאיה","text":"מסוף הקשר חוזר לפעול. מאיה שומעת את תושבי העמק ומבטיחה להעביר להם את ההחלטה שלך. השקעת אנרגיה, אך לא נשארת לבד.","effects":{"energy":-1,"helped":true},"choices":[["לחזור למסדרון","Fork"]]},"GuardianGate":{"title":"השומר האפור","text":"המערכת אומרת: ״בעבר הופעל הכוח בלי בקרה. לא אתן לאסון להתרחש שוב״. מעבר אחרון מפריד בינך לבין הליבה.","choices":[["לחקור מדוע ננעלה הליבה","QuestionGuardian"],["לדלג על השיחה ולחצות","FinalBridge"],["להגביר את הפנס על חשבון שתי יחידות אנרגיה","RiskyCrossing"]]},"RiskyCrossing":{"title":"קיצור הדרך המסוכן","text":"נור מגביר/ה את עוצמת הפנס. המעבר מתבהר אך גבישי האנרגיה מתחממים והמד צונח. קיצור הדרך עלול להפוך למלכודת.","effects":{"energy":-2},"choices":[["להמשיך אל הגשר האחרון","FinalBridge"]]},"QuestionGuardian":{"title":"הסיבה לנעילה","text":"השומר האפור מציג תיעוד מקורי: הוא נועד למנוע קריסת מערכות, לא לשלוט בתושבים. הגיבור/ה מתחיל/ה להבין את הסכנה שבפתרון פזיז.","effects":{"guardianTrust":true},"choices":[["להמשיך אל הגשר האחרון","FinalBridge"]]},"FinalBridge":{"title":"הגשר האחרון","text":"הפנס מאיר אובליסק אחרון. הגשר נוצר ואז מתפורר מאחוריך. מה שנותר מן האנרגיה יקבע אילו החלטות יהיו אפשריות בליבה.","effects":{"energy":-1},"choices":[["להיכנס אל חדר הליבה","Core","energy>0"],["לראות מה קורה כשאין אנרגיה","EnergyFailure","energy<=0"]]},"Core":{"title":"ההכרעה בליבה","text":"המתג האדום מציע אור מיידי, אך מסוכן. כיול הבטיחות דורש ראיה ואנרגיה. השומר האפור מציע נעילה זהירה. הבחירה שלך משפיעה על סיום הסיפור.","choices":[["להפעיל את הליבה מיד","QuickEnding"],["לכייל את הליבה ולהפעיל בהדרגה (−2 אנרגיה)","StableEnding","clue&&energy>=2"],["ליצור ברית עם השומר האפור","GuardianEnding","guardianTrust"],["לבחור בנעילה מבוקרת","SafeLockEnding"]]},"QuickEnding":{"title":"סיום — אור בכל מחיר","text":"אור לבן שוטף את המצפה, אבל תשתיות העמק מהבהבות. הניצחון מהיר אך חלקי; התקלה טרם נפתרה והאזהרה לא הייתה לשווא.","ending":true,"choices":[["לנסות סיום אחר","Start"]]},"StableEnding":{"title":"סיום — האור היציב","text":"הנתונים מאפשרים להפעיל את הליבה בהדרגה. הגשרים מתייצבים ללא עומס מסוכן. אם סייעת למאיה, האור והקשר חוזרים יחד לעמק; אחרת, נותרה עבודת שיקום אחרונה.","effects":{"energy":-2},"ending":true,"choices":[["לחזור ולבחור אחרת","Start"]]},"GuardianEnding":{"title":"סיום — ברית עם השומר","text":"המערכת מקבלת את ההצעה לבדוק את הליבה באופן משותף. האור בעמק עדיין מוגבל, אך הדרך לשיקום בטוח נפתחת.","ending":true,"choices":[["לנסות שוב","Start"]]},"SafeLockEnding":{"title":"סיום — החושך המוגן","text":"המצפה נשאר כבוי, אולם הסכנה המיידית חולפת. נור בוחר/ת לשוב עם פתרון אחראי, גם במחיר ההמתנה.","ending":true,"choices":[["לנסות שוב","Start"]]},"EnergyFailure":{"title":"כישלון זמני — אין עוד אור","text":"האנרגיה אזלה בטרם הגעת לליבה. זהו רמז לכך שצריך לחסוך בהפעלת הפנס, או לבחור מסלול קצר יותר.","ending":true,"choices":[["לנסות מחדש","Start"]]}};
let state={energy:6,clue:false,helped:false,guardianTrust:false},visits=0,here='Start';
function permitted(cond){if(!cond)return true;switch(cond){case '!clue':return !state.clue;case '!helped':return !state.helped;case 'energy>0':return state.energy>0;case 'energy<=0':return state.energy<=0;case 'clue&&energy>=2':return state.clue&&state.energy>=2;case 'guardianTrust':return state.guardianTrust;default:return false;}}
function goto(id){const p=passages[id];if(!p){alert('Passage not found');return;}
 if(id==='Start'){state={energy:6,clue:false,helped:false,guardianTrust:false};visits=0;}
 else if(p.effects){if(typeof p.effects.energy==='number')state.energy+=p.effects.energy;
 for(const k of ['clue','helped','guardianTrust'])if(p.effects[k]===true)state[k]=true;}
 visits++;here=id;
 document.getElementById('sceneCount').textContent=`סצנה ${visits}`+(p.ending?' · סיום':'');
 document.getElementById('title').textContent=p.title;
 let content=p.text;
 if(id==='StableEnding')content+='\n\n'+(state.helped?'סיום מלא: גם הקשר עם העמק שוחזר.':'סיום בטוח: הקשר עם העמק עדיין דורש תיקון.');
 document.getElementById('content').textContent=content;
 document.getElementById('stats').innerHTML='';
 for(const [name,val] of [['אנרגיה',state.energy],['יומן בטיחות',state.clue?'נמצא':'לא נמצא'],['קשר עם מאיה',state.helped?'פעיל':'כבוי']]){const el=document.createElement('span');el.className='stat';el.textContent=name+': '+val;document.getElementById('stats').appendChild(el);}
 const choices=document.getElementById('choices');choices.replaceChildren();for(const [label,target,cond] of p.choices){if(!permitted(cond))continue;const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=label;b.addEventListener('click',()=>goto(target));choices.appendChild(b);}
 window.scrollTo({top:0,behavior:'instant'});
}
document.getElementById('restart').addEventListener('click',()=>goto('Start'));goto('Start');
</script></body></html>
